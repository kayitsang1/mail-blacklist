name: Mail Blacklist

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mail-blacklist
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Process mail accounts
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}

          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}

          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}

          # Cloudflare Workers AI
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

          # Optional. Comma/newline-separated model override.
          # Leave unset to use Gemma -> GLM -> Llama fallback.
          CF_AI_MODELS: ${{ vars.CF_AI_MODELS }}

          # Optional safety allowlists. Comma/newline/semicolon-separated.
          AI_ALLOWLIST_SENDERS: ${{ secrets.AI_ALLOWLIST_SENDERS }}
          AI_ALLOWLIST_DOMAINS: ${{ secrets.AI_ALLOWLIST_DOMAINS }}

        run: |
          python mail_blacklist.py

      - name: Save updated blacklists and AI state
        run: |
          BLACKLIST_FILES="icloud_blacklist.txt yahoo_blacklist.txt qq_blacklist.txt"
          STATE_FILE="mail_ai_state.json"
          FILES="$BLACKLIST_FILES $STATE_FILE"

          if git diff --quiet -- $FILES; then
            echo "Blacklists and AI state unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add $FILES
          git commit -m "Update mail blacklists and AI state"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected."

              git rebase --abort

              # Preserve this run's generated blacklist/state files.
              for file in $BLACKLIST_FILES; do
                cp "$file" "/tmp/$file"
              done

              if [ -f "$STATE_FILE" ]; then
                cp "$STATE_FILE" "/tmp/$STATE_FILE"
              else
                printf '{\n  "version": 1,\n  "accounts": {}\n}\n' > "/tmp/$STATE_FILE"
              fi

              # Return to the latest remote main.
              git reset --hard origin/main

              # Merge blacklists as normalized unique email-address lines.
              for file in $BLACKLIST_FILES; do
                tmp="/tmp/$file"

                touch "$file"

                cat "$file" "$tmp" \
                  | sed '/^[[:space:]]*$/d' \
                  | tr '[:upper:]' '[:lower:]' \
                  | sort -u \
                  > "${file}.merged"

                mv "${file}.merged" "$file"
              done

              # Merge the persistent AI UID state as JSON rather than as lines.
              python - "$STATE_FILE" "/tmp/$STATE_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path

          current_path = Path(sys.argv[1])
          incoming_path = Path(sys.argv[2])

          def load(path):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  data = {}
              if not isinstance(data, dict):
                  data = {}
              accounts = data.get("accounts")
              if not isinstance(accounts, dict):
                  accounts = {}
              return accounts

          current = load(current_path)
          incoming = load(incoming_path)
          merged = {}

          for name in sorted(set(current) | set(incoming)):
              a = current.get(name) if isinstance(current.get(name), dict) else {}
              b = incoming.get(name) if isinstance(incoming.get(name), dict) else {}

              last_scan = max(
                  int(a.get("last_ai_scan_ms", 0) or 0),
                  int(b.get("last_ai_scan_ms", 0) or 0),
              )

              seen = []
              seen_set = set()
              for item in list(a.get("seen", []) or []) + list(b.get("seen", []) or []):
                  item = str(item)
                  if item and item not in seen_set:
                      seen_set.add(item)
                      seen.append(item)

              merged[name] = {
                  "last_ai_scan_ms": last_scan,
                  "seen": seen[-500:],
              }

          current_path.write_text(
              json.dumps(
                  {"version": 1, "accounts": merged},
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

              git add $FILES

              if git diff --cached --quiet; then
                echo "Remote already contains all blacklist/state updates."
                exit 0
              fi

              git commit -m "Merge mail blacklist and AI state updates"
            fi

            if git push origin HEAD:main; then
              echo "Blacklist/state updates pushed successfully."
              exit 0
            fi

            echo "Push collision. Retrying..."
            sleep $((attempt * 2))
          done

          echo "Unable to push blacklist/state updates after retries."
          exit 1
